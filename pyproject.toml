[project]
name = "astra-study"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "alembic>=1.18.5",
    "cryptography>=49.0.0",
    "email-validator>=2.3.0",
    "fastapi>=0.138.2",
    "langchain>=1.3.11",
    "langchain-openai>=1.3.3",
    "langgraph>=1.2.7",
    "langsmith>=0.9.7",
    "markdown-it-py>=4.2.0",
    "nltk>=3.10.0",
    "openai>=2.44.0",
    "passlib[bcrypt]>=1.7.4",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.0.51",
    "tiktoken>=0.13.0",
    "uvicorn[standard]>=0.49.0",
    "tenacity>=9.1.2",
    "qdrant-client>=1.18.0",
    "fastembed>=0.8.0",
    "transformers>=5.14.1",
    "torch>=2.13.0",
    "flagembedding>=1.4.0",
    "sentence-transformers>=5.6.0",
    "langfuse>=4.14.1",
    "pyyaml>=6.0.3",
    "requests>=2.32.0",
    "streamlit>=1.48.0",
    "docling>=2.99.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
